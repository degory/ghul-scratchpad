name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly, so a newly published compiler or runtime that breaks the
    # scratchpad is caught before someone opens a Codespace on it
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Update the compiler tool to the latest published version
        run: dotnet tool update --local ghul.compiler

      - run: dotnet run
